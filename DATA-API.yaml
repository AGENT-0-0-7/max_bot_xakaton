version: "1.0"
team_id: "team_locator_72"
base_url: "https://locator-backend.example.com/"
checks:
  - name: "Аутентификация через MAX initData"
    method: "POST"
    endpoint: "/api/v1/auth/max/"
    role: "guest"
    headers:
      Content-Type: "application/json"
    body:
      init_data: "user=%7B%22id%22%3A12345678%2C%22first_name%22%3A%22Test%22%7D&auth_date=1700000000&hash=mock_hash"
    expected_status: 200
    expected_schema:
      type: "object"
      required: ["access_token", "user"]
      properties:
        access_token:
          type: "string"
        user:
          type: "object"
          required: ["id", "max_id"]
          properties:
            id:
              type: "integer"
            max_id:
              type: "integer"
  - name: "Получение списка ближайших событий"
    method: "GET"
    endpoint: "/api/v1/events/?lat=57.153033&lon=65.534328&radius=5"
    role: "user"
    headers:
      Authorization: "Bearer {{access_token}}"
    expected_status: 200
    expected_schema:
      type: "array"
      items:
        type: "object"
        required: ["id", "title", "location", "start_time", "available_seats"]
        properties:
          id:
            type: "integer"
          title:
            type: "string"
          location:
            type: "object"
            required: ["latitude", "longitude"]
            properties:
              latitude:
                type: "number"
              longitude:
                type: "number"
          start_time:
            type: "string"
            format: "date-time"
          available_seats:
            type: "integer"
  - name: "Создание нового события"
    method: "POST"
    endpoint: "/api/v1/events/"
    role: "user"
    headers:
      Authorization: "Bearer {{access_token}}"
      Content-Type: "application/json"
    body:
      title: "Студенческий квартирник в ТюмГУ"
      description: "Живая музыка, чай и настолки"
      category: "culture"
      address: "ул. Ленина, 23, Тюмень"
      latitude: 57.153033
      longitude: 65.534328
      start_time: "2026-10-15T18:00:00Z"
      end_time: "2026-10-15T21:00:00Z"
      max_participants: 30
    expected_status: 201
    expected_schema:
      type: "object"
      required: ["id", "status"]
      properties:
        id:
          type: "integer"
        status:
          type: "string"
          enum: ["pending"]
  - name: "Запись на событие"
    method: "POST"
    endpoint: "/api/v1/events/1/register/"
    role: "user"
    headers:
      Authorization: "Bearer {{access_token}}"
    expected_status: 200
    expected_schema:
      type: "object"
      required: ["status", "message"]
      properties:
        status:
          type: "string"
          enum: ["success"]
        message:
          type: "string"
