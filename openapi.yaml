openapi: 3.0.3
info:
  title: Locator Events API
  version: 1.0.0
  description: API for local event discovery and registrations in MAX mini app.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/auth/max/:
    post:
      summary: Validate MAX initData and issue JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - init_data
              properties:
                init_data:
                  type: string
      responses:
        '200':
          description: Auth success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      max_id:
                        type: integer
                      first_name:
                        type: string
                      last_name:
                        type: string
                      username:
                        type: string
        '400':
          description: Invalid input
  /api/v1/events/:
    get:
      summary: List approved events near the user
      parameters:
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lon
          schema:
            type: number
        - in: query
          name: radius
          schema:
            type: number
        - in: query
          name: radius_km
          schema:
            type: number
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: Events list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Create new event as organizer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Event created for moderation
  /api/v1/events/{id}/:
    get:
      summary: Event detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /api/v1/events/{id}/register/:
    post:
      summary: Register user for event
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Registration success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
  /api/v1/users/me/registrations/:
    get:
      summary: List current user's registrations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registration list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    event_id:
                      type: integer
                    title:
                      type: string
                    status:
                      type: string
                    address:
                      type: string
                    start_time:
                      type: string
                        format: date-time
                    registered_at:
                      type: string
                        format: date-time
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Location:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
        longitude:
          type: number
    Event:
      type: object
      required:
        - id
        - title
        - description
        - category
        - address
        - location
        - start_time
        - end_time
        - max_participants
        - status
        - available_seats
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        address:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        max_participants:
          type: integer
        status:
          type: string
        available_seats:
          type: integer
    EventCreate:
      type: object
      required:
        - title
        - description
        - category
        - address
        - latitude
        - longitude
        - start_time
        - end_time
        - max_participants
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        max_participants:
          type: integer
